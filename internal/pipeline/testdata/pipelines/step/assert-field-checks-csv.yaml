id: assert-field-checks-csv

input:
  format: csv

steps:
  - filter:
      field: in_stock
      equals: "true"
  - assert:
      field-equals:
        field: in_stock
        value: "true"
      field-contains:
        field: name
        value: top
      field-matches:
        field: price
        value: '^[0-9]+\.[0-9]{2}$'

output:
  format: csv
